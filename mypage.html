<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="./Asset/icon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>마이페이지 — Thaniya-SoundLab</title>
<link rel="stylesheet" href="app.css?v=20261122i">
</head>
<body data-page="mypage" class="mpOnly">

<div id="myPage" class="show">
  <div class="mpTop">
    <a class="mpBrand" href="./index.html" title="홈으로"><b data-icon="logo" data-logo></b><span class="lbl">Thaniya-SoundLab</span></a>
    <span style="flex:1"></span>
    <button class="btn" id="mpFs" title="전체화면" aria-label="전체화면"></button>
    <a class="btn" id="mpHome" href="./index.html" title="홈" aria-label="홈"><span data-icon="homeH"></span><span class="lbl">홈</span></a>
    <button class="btn" id="mpBack" title="편집 중인 곡으로" aria-label="편집 중인 곡으로"><span data-icon="pen"></span><span class="lbl">편집 중인 곡으로</span></button>
  </div>
  <div class="mpWrap">
    <div class="mpHead">
      <div class="avatar" data-icon="logo" data-logo></div>
      <div><div class="mpTitle">마이페이지</div><div class="mpSub" id="mpSub"></div></div>
      <span style="flex:1"></span>
      <button class="btn" id="mpImport" title="파일 불러오기" aria-label="파일 불러오기"><span data-icon="upload"></span><span class="lbl">파일 불러오기</span></button>
      <button class="btn primary" id="mpNew" title="새 곡 만들기" aria-label="새 곡 만들기"><span data-icon="plus"></span><span class="lbl">새 곡 만들기</span></button>
    </div>
    <div class="mpTools">
      <div class="searchBox mpSearch"><span data-icon="search"></span><input type="search" id="mpSearch" placeholder="곡 이름 검색"></div>
      <select id="mpSort"><option value="updated">최근 수정순</option><option value="created">만든 순</option><option value="name">이름순</option></select>
      <button class="btn" id="mpSelBtn" title="선택" aria-label="선택"><span data-icon="clear"></span><span class="lbl">선택</span></button>
      <span style="flex:1"></span>
      <div class="mpStorage" title="이 브라우저에 저장된 용량"><div class="bar"><div id="mpStoreFill"></div></div><span id="mpStoreTxt"></span></div>
    </div>
    <div class="mpSelBar"><b id="mpSelCnt">0개 선택</b><button class="btn" id="mpSelAll">전체 선택</button><button class="btn danger" id="mpSelDel"><span data-icon="trash"></span>삭제</button><button class="btn" id="mpSelDone">완료</button></div>
    <div id="mpGrid"></div>
    <div class="mpDrop" id="mpDrop">여기에 파일을 놓으면 불러와요 (.json 프로젝트 · .mid MIDI)</div>
  </div>
  <input type="file" id="mpFile" accept=".json,.mid,.midi,application/json,audio/midi" multiple hidden>
</div>

<div id="confirm"><div class="ccard">
  <div class="cicon" data-icon="trash"></div>
  <div class="ctitle" id="cTitle"></div><div class="cmsg" id="cMsg"></div>
  <div class="cbtns"><button class="btn" id="cNo">취소</button><button class="btn danger" id="cYes">확인</button></div>
</div></div>
<div id="toast"></div>
<div id="ctx"></div>

<script>
/* 스크립트 로더: app.js 든 app.js.txt 든 있는 이름으로 불러오고, 서버가 .txt 를 text/plain(+nosniff)으로 막아도 내용을 읽어서 직접 실행함 */
(function () {
  var V = '?v=20261122i', list = [['fullscreen.js', 'fullscreen.js.txt'], ['mypage.js', 'mypage.js.txt']];
  function run(t, src) { var s = document.createElement('script'); s.text = t + '\n//# sourceURL=' + src; document.body.appendChild(s); }
  function one(names, ok, bad) {
    if (!names.length) return bad();
    var n = names[0], s = document.createElement('script');
    s.src = n + V; s.onload = ok;

        .then(function (t) { run(t, n); ok(); })
        .catch(function () { one(names.slice(1), ok, bad); });

    document.body.appendChild(s);
  }
  function fail(n) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:12px 14px;border-radius:12px;background:#2a1212;color:#ffd7d7;border:1px solid #ff4d4d;font:600 13px system-ui,sans-serif'; d.textContent = '스크립트를 불러오지 못했어요: ' + n[0] + ' (또는 ' + n[1] + ') — 같은 폴더에 있는지 확인해 주세요'; document.body.appendChild(d); }
  (function next(i) { if (i < list.length) one(list[i], function () { next(i + 1); }, function () { fail(list[i]); }); })(0);
})();
</script>
</body>
</html>
